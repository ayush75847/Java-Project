spring.config.import=optional:file:.env[.properties]

spring.application.name=inkly
spring.mongodb.uri=mongodb://localhost:27017/inkly
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET:inkly-dev-secret-key-change-me-0123456789abcdef}
app.jwt.expiration-ms=86400000
app.frontend-url=http://localhost:5173
spring.web.error.include-stacktrace=never

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Max image size (Spring rejects bigger uploads before our code runs)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
