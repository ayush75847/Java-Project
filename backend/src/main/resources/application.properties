spring.config.import=optional:file:.env[.properties]

spring.application.name=inkly
spring.mongodb.uri=mongodb://localhost:27017/inkly
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET:inkly-dev-secret-key-change-me-0123456789abcdef}
app.jwt.expiration-ms=86400000
app.frontend-url=http://localhost:5173
spring.web.error.include-stacktrace=never

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Max image size (Spring rejects bigger uploads before our code runs)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---------- First admin (created on startup if missing) ----------
app.admin.username=${ADMIN_USERNAME:admin}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# ---------- Email (OTP) ----------
# false = OTP is printed in the backend terminal (no email needed while developing)
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Google login (OAuth2) ----------
# The defaults let the app start without Google keys (only the Google button won't work)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:not-configured}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
spring.security.oauth2.client.registration.google.scope=openid,profile,email