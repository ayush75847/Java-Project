spring.application.name=blog
server.port=8080

# ---------- MongoDB ----------
# Local MongoDB (install MongoDB Community or use Docker). For MongoDB Atlas paste your connection string here.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/blogdb}
# Creates the unique index on users.email from the @Indexed annotation
spring.data.mongodb.auto-index-creation=true

# ---------- JWT ----------
# Must be at least 32 characters. Change this in real projects!
app.jwt.secret=${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-1234567890}
app.jwt.expiration-ms=86400000

# ---------- Frontend ----------
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# ---------- Default admin (created on first start) ----------
app.admin.email=${ADMIN_EMAIL:admin@blog.com}
app.admin.password=${ADMIN_PASSWORD:admin123}

# ---------- Email (OTP) ----------
# false = OTP is only printed in the backend console (easiest for learning).
# true  = OTP is really emailed. For Gmail create an "App password" (Google Account > Security).
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Google OAuth2 ----------
# Create credentials at https://console.cloud.google.com/apis/credentials
# Authorized redirect URI: http://localhost:8080/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
